name: Build macOS C++ K-Line Viewer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: macos-cpp-kline-viewer-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: "qtwebsockets"
          cache: true

      - name: Configure
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQ4J_UPDATE_REPO="${{ github.repository }}" \
            -DQ4J_APP_VERSION="${APP_VERSION}"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: macdeployqt build/q4j_kline_viewer.app -verbose=2

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - build/q4j_kline_viewer.app

      - name: Create dmg
        run: |
          mkdir -p build/package
          hdiutil create \
            -volname "Q4J K-Line Viewer" \
            -srcfolder build/q4j_kline_viewer.app \
            -ov \
            -format UDZO \
            build/package/q4j-kline-viewer-macos.dmg

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: q4j-kline-viewer-macos
          path: build/package/q4j-kline-viewer-macos.dmg

      - name: Upload dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/package/q4j-kline-viewer-macos.dmg
