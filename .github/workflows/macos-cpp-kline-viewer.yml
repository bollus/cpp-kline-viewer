name: Build macOS C++ K-Line Viewer

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: "qtwebsockets"
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        run: macdeployqt build/q4j_kline_viewer.app -verbose=2

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - build/q4j_kline_viewer.app

      - name: Create dmg
        run: |
          mkdir -p build/package
          hdiutil create \
            -volname "Q4J K-Line Viewer" \
            -srcfolder build/q4j_kline_viewer.app \
            -ov \
            -format UDZO \
            build/package/q4j-kline-viewer-macos.dmg

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: q4j-kline-viewer-macos
          path: build/package/q4j-kline-viewer-macos.dmg
