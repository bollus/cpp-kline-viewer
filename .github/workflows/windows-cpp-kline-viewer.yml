name: Build Windows C++ K-Line Viewer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-cpp-kline-viewer-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: "qtwebsockets"
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Inno Setup Chinese language pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force installer/Languages | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" `
            -OutFile "installer/Languages/ChineseSimplified.isl"

      - name: Configure
        shell: pwsh
        run: |
          $appVersion = "${{ github.ref_name }}"
          if ($appVersion.StartsWith("v")) { $appVersion = $appVersion.Substring(1) }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DQ4J_UPDATE_REPO="${{ github.repository }}" `
            -DQ4J_APP_VERSION="$appVersion"

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/q4j_kline_viewer.exe package/ -Force
          windeployqt --release --compiler-runtime --no-translations package/q4j_kline_viewer.exe
          Copy-Item fonts package/fonts -Recurse -Force

      - name: Get app version
        id: version
        shell: pwsh
        run: |
          $appVersion = "${{ github.ref_name }}"
          if ($appVersion.StartsWith("v")) { $appVersion = $appVersion.Substring(1) }
          "version=$appVersion" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            installer/q4j-kline-viewer.iss `
            /DMyAppVersion="${{ steps.version.outputs.version }}" `
            /DSourceDir="$pwd\package"

      - name: List package output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse package | Select-Object FullName, Length
          Get-ChildItem -Recurse build/installer | Select-Object FullName, Length
          Get-FileHash package/q4j_kline_viewer.exe -Algorithm SHA256
          Get-FileHash build/installer/q4j-kline-viewer-windows-setup.exe -Algorithm SHA256

      - name: Scan package with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            Update-MpSignature
          } catch {
            Write-Warning "Microsoft Defender signature update failed: $($_.Exception.Message)"
          }
          try {
            Start-MpScan -ScanPath (Resolve-Path package) -ScanType CustomScan
          } catch {
            Write-Warning "Microsoft Defender package scan could not run: $($_.Exception.Message)"
          }

      - name: Scan installer with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Resolve-Path build/installer/q4j-kline-viewer-windows-setup.exe
          try {
            Start-MpScan -ScanPath $installer -ScanType CustomScan
          } catch {
            Write-Warning "Microsoft Defender installer scan could not run: $($_.Exception.Message)"
          }
          if (!(Test-Path $installer)) {
            throw "Microsoft Defender removed or quarantined the installer"
          }
          $threats = Get-MpThreatDetection | Where-Object { $_.Resources -contains $installer.Path }
          if ($threats) {
            $threats | Format-List *
            throw "Microsoft Defender detected the installer"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: q4j-kline-viewer-windows-installer
          path: build/installer/q4j-kline-viewer-windows-setup.exe

      - name: Upload installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/q4j-kline-viewer-windows-setup.exe
