name: Build Windows C++ K-Line Viewer

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: "qtwebsockets"
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item build/Release/q4j_kline_viewer.exe build/package/
          windeployqt --release --compiler-runtime build/package/q4j_kline_viewer.exe

      - name: Create single Windows exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7z.exe not found" }
          $sfx = "${env:ProgramFiles}\7-Zip\7z.sfx"
          if (!(Test-Path $sfx)) { throw "7z.sfx not found" }

          Push-Location build/package
          & $sevenZip a -t7z ..\package.7z *
          Pop-Location

          $config = @"
          ;!@Install@!UTF-8!
          Title="Q4J K-Line Viewer"
          BeginPrompt="Run Q4J K-Line Viewer?"
          RunProgram="q4j_kline_viewer.exe"
          GUIMode="2"
          ;!@InstallEnd@!
          "@
          Set-Content -Path build/sfx-config.txt -Value $config -Encoding UTF8
          $out = "build/q4j-kline-viewer-windows.exe"
          $outStream = [System.IO.File]::Open($out, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          foreach ($part in @($sfx, "build/sfx-config.txt", "build/package.7z")) {
            if (!(Test-Path $part)) { throw "Missing SFX part: $part" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $part))
            $outStream.Write($bytes, 0, $bytes.Length)
          }
          $outStream.Close()
          if (!(Test-Path build/q4j-kline-viewer-windows.exe)) { throw "SFX exe was not created" }
          Get-Item build/q4j-kline-viewer-windows.exe | Format-List FullName,Length

      - name: List package output
        shell: pwsh
        run: Get-ChildItem -Recurse build | Select-Object FullName, Length

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: q4j-kline-viewer-windows-exe
          path: build/q4j-kline-viewer-windows.exe
