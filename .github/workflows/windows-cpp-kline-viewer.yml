name: Build Windows C++ K-Line Viewer

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_FEATURE_FLAGS: "binarycaching"

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/build/vcpkg_installed
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: windows-static-qt-${{ hashFiles('CMakeLists.txt') }}

      - name: Install static Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          vcpkg install `
            qtbase:x64-windows-static-release `
            qtwebsockets:x64-windows-static-release `
            --overlay-triplets=triplets `
            --clean-after-build

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_OVERLAY_TRIPLETS="triplets" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"

      - name: Build
        run: cmake --build build --config Release

      - name: List package output
        shell: pwsh
        run: Get-ChildItem -Recurse build/Release | Select-Object FullName, Length

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: q4j-kline-viewer-windows-exe
          path: build/Release/q4j_kline_viewer.exe
