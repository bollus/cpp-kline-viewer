name: Build Windows C++ K-Line Viewer

on:
  workflow_dispatch:
  push:
    paths:
      - "**"

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          modules: "qtwebsockets"
          cache: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/package | Out-Null
          Copy-Item build/Release/q4j_kline_viewer.exe build/package/
          windeployqt --release --compiler-runtime build/package/q4j_kline_viewer.exe

      - name: Create single Windows exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install winrar --yes --no-progress
          $winrar = "${env:ProgramFiles}\WinRAR\WinRAR.exe"
          if (!(Test-Path $winrar)) { $winrar = "${env:ProgramFiles(x86)}\WinRAR\WinRAR.exe" }
          if (!(Test-Path $winrar)) { throw "WinRAR.exe not found" }

          $config = @"
          ;The comment below contains SFX script commands

          Path=%TEMP%\q4j-kline-viewer
          SavePath
          Setup=q4j_kline_viewer.exe
          Silent=1
          Overwrite=1
          Title=Q4J K-Line Viewer
          "@
          Set-Content -Path build/sfx-comment.txt -Value $config -Encoding ASCII
          & $winrar a -r -sfx -zbuild/sfx-comment.txt build/q4j-kline-viewer-windows.exe build/package/*

      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: q4j-kline-viewer-windows-exe
          path: build/q4j-kline-viewer-windows.exe
